<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produtos - GFCCE Admin</title>
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages/admin.css">
</head>
<body>

<main class="admin-content">
  <div class="admin-topbar">
    <button class="btn-menu-mobile" id="btn-abrir-menu"><i class="fa-solid fa-bars"></i></button>
    <h1><i class="fa-solid fa-box"></i> Produtos e Promoções</h1>
  </div>

  <div class="tabs" style="display:flex; gap:8px; margin-bottom:var(--sp-5);">
    <button class="chip ativo" data-painel="produtos">Produtos</button>
    <button class="chip" data-painel="categorias">Categorias</button>
    <button class="chip" data-painel="cupons">Cupons/Promoções</button>
  </div>

  <!-- ---------- Produtos ---------- -->
  <section id="painel-produtos">
    <div class="filtros-bar">
      <div class="busca-flex"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="busca-produto" placeholder="Buscar produto..." /></div>
      <select id="filtro-categoria-produto"><option value="todas">Todas categorias</option></select>
      <button class="btn btn-primary" id="btn-novo-produto"><i class="fa-solid fa-plus"></i> Novo produto</button>
    </div>
    <div class="tabela-wrap">
      <table class="tabela-admin">
        <thead><tr><th></th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead>
        <tbody id="tbody-produtos"></tbody>
      </table>
    </div>
  </section>

  <!-- ---------- Categorias ---------- -->
  <section id="painel-categorias" class="hidden">
    <div class="filtros-bar">
      <input type="text" id="input-nova-categoria" placeholder="Nome da nova categoria" style="flex:1;" />
      <button class="btn btn-primary" id="btn-add-categoria"><i class="fa-solid fa-plus"></i> Adicionar</button>
    </div>
    <div class="tabela-wrap">
      <table class="tabela-admin"><thead><tr><th>Categoria</th><th>Ações</th></tr></thead><tbody id="tbody-categorias"></tbody></table>
    </div>
  </section>

  <!-- ---------- Cupons ---------- -->
  <section id="painel-cupons" class="hidden">
    <div class="filtros-bar">
      <button class="btn btn-primary" id="btn-novo-cupom"><i class="fa-solid fa-plus"></i> Novo cupom</button>
    </div>
    <div class="tabela-wrap">
      <table class="tabela-admin"><thead><tr><th>Código</th><th>Tipo</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tbody-cupons"></tbody></table>
    </div>
  </section>
</main>

<!-- ---------- Modal Produto ---------- -->
<div class="modal-overlay" id="modal-produto">
  <div class="modal">
    <div class="modal-header"><h3 id="titulo-modal-produto">Novo produto</h3><button class="modal-fechar" data-fechar-modal="modal-produto"><i class="fa-solid fa-xmark"></i></button></div>
    <form id="form-produto">
      <div class="upload-produto-img" id="upload-produto-img">
        <i class="fa-solid fa-image"></i>
        <p style="margin-top:8px;">Cole abaixo o link (URL) da imagem do produto</p>
      </div>
      <div class="campo"><label for="p-imagem">URL da imagem</label><input type="url" id="p-imagem" placeholder="https://i.ibb.co/..." /></div>
      <div class="campo"><label for="p-nome">Nome</label><input type="text" id="p-nome" required /></div>
      <div class="campo"><label for="p-descricao">Descrição</label><textarea id="p-descricao"></textarea></div>
      <div class="linha-2col">
        <div class="campo"><label for="p-categoria">Categoria</label><select id="p-categoria" required></select></div>
        <div class="campo"><label for="p-estoque">Estoque</label><input type="number" id="p-estoque" min="0" value="0" required /></div>
      </div>
      <div class="linha-2col">
        <div class="campo"><label for="p-preco">Preço (R$)</label><input type="number" id="p-preco" min="0" step="0.01" required /></div>
        <div class="campo"><label for="p-preco-promo">Preço promocional (opcional)</label><input type="number" id="p-preco-promo" min="0" step="0.01" /></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-salvar-produto">Salvar produto</button>
    </form>
  </div>
</div>

<!-- ---------- Modal Cupom ---------- -->
<div class="modal-overlay" id="modal-cupom">
  <div class="modal">
    <div class="modal-header"><h3>Novo cupom</h3><button class="modal-fechar" data-fechar-modal="modal-cupom"><i class="fa-solid fa-xmark"></i></button></div>
    <form id="form-cupom">
      <div class="campo"><label for="c-codigo">Código</label><input type="text" id="c-codigo" placeholder="Ex: SEMANA10" required style="text-transform:uppercase;" /></div>
      <div class="linha-2col">
        <div class="campo"><label for="c-tipo">Tipo</label>
          <select id="c-tipo"><option value="percentual">Percentual (%)</option><option value="fixo">Valor fixo (R$)</option></select>
        </div>
        <div class="campo"><label for="c-valor">Valor</label><input type="number" id="c-valor" min="0" step="0.01" required /></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Salvar cupom</button>
    </form>
  </div>
</div>

<script type="module" src="../../js/admin/produtos-admin.js"></script>
</body>
</html>

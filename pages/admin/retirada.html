<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retirada - GFCCE Admin</title>
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages/admin.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<main class="admin-content">
  <div class="admin-topbar">
    <button class="btn-menu-mobile" id="btn-abrir-menu"><i class="fa-solid fa-bars"></i></button>
    <h1><i class="fa-solid fa-qrcode"></i> Retirada de pedidos</h1>
  </div>

  <div class="retirada-box">
    <div class="card" style="text-align:center;">
      <div id="leitor-qr"></div>
      <button class="btn btn-outline btn-block" id="btn-toggle-camera" style="margin-top:14px;">
        <i class="fa-solid fa-camera"></i> Ligar câmera e escanear
      </button>

      <div style="display:flex; align-items:center; gap:10px; margin:20px 0; color:var(--cinza-600); font-size:0.82rem;">
        <div style="flex:1; height:1px; background:var(--cinza-300);"></div> ou digite o código <div style="flex:1; height:1px; background:var(--cinza-300);"></div>
      </div>

      <form id="form-codigo-manual" style="display:flex; gap:10px;">
        <input type="text" id="input-codigo-manual" placeholder="Ex: A7B3K9P2" style="flex:1; border:1.5px solid var(--cinza-300); border-radius:var(--raio-md); padding:12px 16px; text-transform:uppercase; letter-spacing:0.1em; text-align:center; font-weight:700;" />
        <button type="submit" class="btn btn-secondary"><i class="fa-solid fa-check"></i></button>
      </form>
    </div>

    <div id="area-resultado"></div>
  </div>
</main>

<script type="module" src="../../js/admin/retirada-admin.js"></script>
</body>
</html>

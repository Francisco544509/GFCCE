<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finalizar pedido - GFCCE</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/pages/loja.css">
<style>
  .layout-checkout { display:grid; grid-template-columns: 1fr; gap: var(--sp-5); margin-top: var(--sp-5); }
  @media (min-width: 860px) { .layout-checkout { grid-template-columns: 1.6fr 1fr; } }
  .secao-checkout { margin-bottom: var(--sp-5); }
  .secao-checkout h3 { margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
</style>
</head>
<body>

<main class="pagina">
  <div class="container">
    <a href="carrinho.html" style="display:inline-flex; align-items:center; gap:6px; margin-top:var(--sp-5); color:var(--cinza-600); font-weight:600; font-size:0.88rem;">
      <i class="fa-solid fa-arrow-left"></i> Voltar ao carrinho
    </a>
    <h1 style="margin-top:10px;"><i class="fa-solid fa-bag-shopping"></i> Finalizar pedido</h1>

    <div class="layout-checkout">
      <div>
        <div class="card secao-checkout">
          <h3><i class="fa-solid fa-credit-card" style="color:var(--laranja-500);"></i> Forma de pagamento</h3>
          <div class="opcoes-grid" id="opcoes-pagamento">
            <label class="opcao-radio" data-valor="pix">
              <input type="radio" name="pagamento" value="pix" checked />
              <i class="fa-solid fa-qrcode"></i> PIX
            </label>
            <label class="opcao-radio" data-valor="dinheiro">
              <input type="radio" name="pagamento" value="dinheiro" />
              <i class="fa-solid fa-money-bill-wave"></i> Dinheiro
            </label>
            <label class="opcao-radio" data-valor="cartao">
              <input type="radio" name="pagamento" value="cartao" />
              <i class="fa-solid fa-credit-card"></i> Cartão
            </label>
          </div>
        </div>

        <div class="card secao-checkout">
          <h3><i class="fa-solid fa-clock" style="color:var(--laranja-500);"></i> Horário de retirada</h3>
          <div class="categorias-scroll" id="opcoes-horario"></div>
        </div>
      </div>

      <aside class="resumo-pedido">
        <h3 style="margin-bottom:16px;">Resumo do pedido</h3>
        <div id="mini-lista-itens" style="margin-bottom:12px;"></div>
        <div class="resumo-linha"><span>Subtotal</span><span id="valor-subtotal">R$ 0,00</span></div>
        <div class="resumo-linha" id="linha-desconto" style="display:none;"><span>Desconto</span><span id="valor-desconto">- R$ 0,00</span></div>
        <div class="resumo-linha total"><span>Total</span><span id="valor-total">R$ 0,00</span></div>
        <button class="btn btn-primary btn-block" id="btn-confirmar" style="margin-top:20px;">
          <span class="btn-texto">Ir para pagamento <i class="fa-solid fa-arrow-right"></i></span>
        </button>
      </aside>
    </div>
  </div>
</main>

<script type="module" src="../js/checkout.js"></script>
</body>
</html>
